{% set name = "MobiVision-M" %}
{% set version = "1.3.2" %}
{% set build_number = "0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  git_url: https://github.com/Bicyclecardcn/MobiVision-M.git
  git_rev: main

build:
  number: {{ build_number }}
  script: 
    - "{{ PYTHON }} -m pip install . -vv"
    - cp $SRC_DIR/mobivision-M $PREFIX/bin/mobivision-M
    - chmod +x $PREFIX/bin/mobivision-M
  noarch: python

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools >=45
    - wheel
  run:
    - python >=3.8
    - numpy 1.24.4
    - pandas 2.0.3
    - scanpy 1.9.8
    - rtoml 0.11.0
    - structlog 25.5.0
    - loguru 0.7.3
    - mako 1.3.10
    - matplotlib
    - scikit-learn 1.3.2
    - scipy 1.10.1

test:
  commands:
    - mobivision-M --help 

about:
  home: https://github.com/Bicyclecardcn/MobiVision-M
  summary: MobiVision-M is a linux based software design specifically for single-microbe RNA sequencing analysis.
  license: Apache-2.0
  license_file: LICENSE
  dev_url: https://github.com/Bicyclecardcn/MobiVision-M

extra:
  recipe-maintainers:
    - Bicyclecardcn